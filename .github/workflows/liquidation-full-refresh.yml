name: Liquidation Snapshot Full Refresh

on:
  workflow_dispatch:
    inputs:
      chainKeys:
        description: 'Optional CSV chain keys (e.g. ethereum,arbitrum)'
        required: false
        default: ''
      testApiLimit:
        description: 'Optional API page size override for testing'
        required: false
        default: ''
      testGraphLimit:
        description: 'Optional Graph chunk size override for testing'
        required: false
        default: ''

permissions:
  contents: write
  pull-requests: write

jobs:
  full-refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Sync snapshot from API + existing files
        env:
          TEST_API_LIMIT: ${{ inputs.testApiLimit }}
          TEST_GRAPH_LIMIT: ${{ inputs.testGraphLimit }}
        run: |
          set -euo pipefail
          EXTRA=""
          if [ -n "${{ inputs.chainKeys }}" ]; then
            EXTRA="--chainKeys=${{ inputs.chainKeys }}"
          fi
          node ./scripts/sync-liquidation-silos.mjs full $EXTRA

      - name: Detect snapshot changes
        id: detect
        run: |
          if git diff --quiet -- src/data/liquidation/silos; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No snapshot changes detected."
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create PR with refreshed snapshot
        if: steps.detect.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: chore/liquidation-full-refresh
          commit-message: 'chore: refresh liquidation silo snapshots'
          title: 'chore: refresh liquidation silo snapshots'
          body: |
            Automated full refresh for liquidation snapshot data.

            - source: union(existing snapshot, earn API)
            - scope: static silo metadata only
