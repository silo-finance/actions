name: FULL REFRESH SILOS

on:
  workflow_dispatch:
    inputs:
      chainKeys:
        description: 'Optional CSV chain keys (e.g. ethereum,arbitrum)'
        required: false
        default: ''
      testApiLimit:
        description: 'Optional API page size override for testing'
        required: false
        default: ''
      testGraphLimit:
        description: 'Optional Graph chunk size override for testing'
        required: false
        default: ''

permissions:
  contents: write
  pull-requests: write

jobs:
  full-refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Sync snapshot from GraphQL minus blacklist
        env:
          TEST_API_LIMIT: ${{ inputs.testApiLimit }}
          TEST_GRAPH_LIMIT: ${{ inputs.testGraphLimit }}
          # Optional override; script defaults to https://api-v3.silo.finance/graphql
          LIQ_GRAPHQL_URL: ${{ vars.LIQ_GRAPHQL_URL }}
          # Private CI-only RPC endpoints. Unset secrets resolve to empty and the script
          # falls back to its hardcoded public RPC default per chain.
          RPC_URL_ETHEREUM: ${{ secrets.RPC_URL_ETHEREUM }}
          RPC_URL_ARBITRUM: ${{ secrets.RPC_URL_ARBITRUM }}
          RPC_URL_AVALANCHE: ${{ secrets.RPC_URL_AVALANCHE }}
          RPC_URL_SONIC: ${{ secrets.RPC_URL_SONIC }}
          RPC_URL_XDC: ${{ secrets.RPC_URL_XDC }}
          RPC_URL_INJECTIVE: ${{ secrets.RPC_URL_INJECTIVE }}
        run: |
          set -euo pipefail
          EXTRA=""
          if [ -n "${{ inputs.chainKeys }}" ]; then
            EXTRA="--chainKeys=${{ inputs.chainKeys }}"
          fi
          node ./scripts/sync-liquidation-silos.mjs full $EXTRA

      - name: Detect snapshot changes
        id: detect
        run: |
          if git diff --quiet -I '^[[:space:]]*"generatedAt":[[:space:]]*".*",$' -- src/data/silos/*.json; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No snapshot changes detected (or only generatedAt changed)."
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create PR with refreshed snapshot
        if: steps.detect.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: chore/full-refresh-silos
          commit-message: 'chore: refresh silo snapshots'
          title: 'chore: refresh silo snapshots'
          body: |
            Automated full refresh for static silo snapshot data.

            - source: GraphQL v3 markets (`siloId >= 3000`) minus `src/data/silos/blacklist/`
            - legacy rows in existing snapshots are preserved
            - scope: static silo metadata only
