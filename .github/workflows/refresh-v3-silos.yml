name: Refresh V3 Silos

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'Source ref for sync scripts (branch, tag, or SHA). Data always writes to legacy-positions.'
        required: false
        default: 'master'
        type: string
      chainKeys:
        description: 'Optional CSV chain keys (e.g. ethereum,arbitrum)'
        required: false
        default: ''
      testApiLimit:
        description: 'Optional API page size override for testing'
        required: false
        default: ''
      testGraphLimit:
        description: 'Optional GraphQL page size override for testing'
        required: false
        default: ''
  schedule:
    # Every hour at minute 0 (UTC); same cadence as Pull Legacy Positions.
    - cron: '0 * * * *'

permissions:
  contents: write

concurrency:
  group: refresh-v3-silos
  cancel-in-progress: false

env:
  # Same data branch as Pull Legacy Positions — never the feature/PR branch.
  TARGET_BRANCH: legacy-positions

jobs:
  refresh-v3:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve source ref
        id: refs
        run: |
          set -euo pipefail
          SOURCE_REF="${{ inputs.source_ref }}"
          if [ -z "$SOURCE_REF" ]; then
            # Scheduled runs have no inputs; always use master (like Pull Legacy Positions).
            SOURCE_REF="master"
          fi
          echo "source_ref=$SOURCE_REF" >> "$GITHUB_OUTPUT"
          echo "::notice::Scripts from ${SOURCE_REF}; silo JSON publishes to ${TARGET_BRANCH} only."

      - name: Checkout source ref (scripts + working silo baseline)
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.refs.outputs.source_ref }}
          fetch-depth: 0

      - name: Use master blacklist (source of truth)
        run: |
          set -euo pipefail
          git fetch origin master
          git checkout origin/master -- src/data/silos/blacklist

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Refresh v3 snapshot from GraphQL minus blacklist
        env:
          TEST_API_LIMIT: ${{ inputs.testApiLimit }}
          TEST_GRAPH_LIMIT: ${{ inputs.testGraphLimit }}
          # Optional override; script defaults to https://api-v3.silo.finance/graphql
          LIQ_GRAPHQL_URL: ${{ vars.LIQ_GRAPHQL_URL }}
          # Private CI-only RPC endpoints. Unset secrets resolve to empty and the script
          # falls back to its hardcoded public RPC default per chain.
          RPC_URL_ETHEREUM: ${{ secrets.RPC_URL_ETHEREUM }}
          RPC_URL_ARBITRUM: ${{ secrets.RPC_URL_ARBITRUM }}
          RPC_URL_AVALANCHE: ${{ secrets.RPC_URL_AVALANCHE }}
          RPC_URL_SONIC: ${{ secrets.RPC_URL_SONIC }}
          RPC_URL_XDC: ${{ secrets.RPC_URL_XDC }}
          RPC_URL_INJECTIVE: ${{ secrets.RPC_URL_INJECTIVE }}
        run: |
          set -euo pipefail
          EXTRA=""
          if [ -n "${{ inputs.chainKeys }}" ]; then
            EXTRA="--chainKeys=${{ inputs.chainKeys }}"
          fi
          node ./scripts/sync-liquidation-silos.mjs full $EXTRA

      - name: Detect snapshot changes
        id: detect
        run: |
          if git diff --quiet -I '^[[:space:]]*"generatedAt":[[:space:]]*".*",$' -- src/data/silos/*.json; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No v3 snapshot changes detected (or only generatedAt changed)."
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare silo export bundle
        if: steps.detect.outputs.has_changes == 'true'
        run: |
          set -euo pipefail
          EXPORT_DIR="${RUNNER_TEMP}/silos-data-branch"
          mkdir -p "${EXPORT_DIR}"
          cp src/data/silos/*.json "${EXPORT_DIR}/"
          echo "EXPORT_DIR=${EXPORT_DIR}" >> "$GITHUB_ENV"

      - name: Push silo snapshots to legacy-positions
        if: steps.detect.outputs.has_changes == 'true'
        env:
          COMMIT_MESSAGE: 'chore: refresh v3 silo snapshots'
        run: |
          set -euo pipefail
          chmod +x ./scripts/ci/push-silos-to-data-branch.sh
          ./scripts/ci/push-silos-to-data-branch.sh "${EXPORT_DIR}"

      - name: Log published URLs
        if: steps.detect.outputs.has_changes == 'true'
        run: |
          echo "::notice::Source ref: ${{ steps.refs.outputs.source_ref }}"
          echo "::notice::Target branch: ${TARGET_BRANCH}"
          echo "::notice::Silos base URL: https://raw.githubusercontent.com/${{ github.repository }}/refs/heads/${TARGET_BRANCH}/src/data/silos"
          for f in ethereum arbitrum avalanche injective sonic xdc; do
            echo "::notice:: - https://raw.githubusercontent.com/${{ github.repository }}/refs/heads/${TARGET_BRANCH}/src/data/silos/${f}.json"
          done
