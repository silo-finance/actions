name: REMOVE ANY SILO

on:
  workflow_dispatch:
    inputs:
      chainKey:
        description: 'Chain key where this silo should be removed'
        required: true
        type: choice
        options:
          - ethereum
          - arbitrum
          - avalanche
          - injective
          - sonic
          - xdc
      siloAddress:
        description: 'Silo market address (0x...)'
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  remove-silo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Resolve market metadata for messages
        id: market_meta
        env:
          CHAIN_KEY: ${{ inputs.chainKey }}
          SILO_ADDRESS: ${{ inputs.siloAddress }}
        run: |
          set -euo pipefail

          chain_upper="$(printf '%s' "$CHAIN_KEY" | tr '[:lower:]' '[:upper:]')"
          address="$(printf '%s' "$SILO_ADDRESS" | tr '[:upper:]' '[:lower:]')"
          market_meta="$(
            node -e '
              const fs = require("fs");
              const chainKey = process.env.CHAIN_KEY;
              const address = (process.env.SILO_ADDRESS || "").toLowerCase();
              const file = `src/data/silos/${chainKey}.json`;
              const payload = JSON.parse(fs.readFileSync(file, "utf8"));
              const silos = Array.isArray(payload?.silos) ? payload.silos : [];
              let symbol = "";
              let siloId = "";
              for (const row of silos) {
                if ((row?.siloAddress || "").toLowerCase() === address) {
                  symbol = row?.tokenSymbol || "";
                  siloId = row?.siloId == null ? "" : String(row.siloId);
                  break;
                }
                if ((row?.otherSilo?.siloAddress || "").toLowerCase() === address) {
                  symbol = row?.otherSilo?.tokenSymbol || "";
                  siloId = row?.otherSilo?.siloId == null ? "" : String(row.otherSilo.siloId);
                  break;
                }
              }
              process.stdout.write(`${symbol}\t${siloId}`);
            '
          )"
          IFS=$'\t' read -r token_symbol silo_id <<< "$market_meta"
          silo_ref="#${silo_id:-unknown}"

          if [ -n "$token_symbol" ]; then
            title="Remove ${silo_ref} (${token_symbol}) from ${chain_upper}"
          else
            title="Remove ${silo_ref} from ${chain_upper}"
          fi

          echo "title=${title}" >> "$GITHUB_OUTPUT"
          echo "commit_message=${title}" >> "$GITHUB_OUTPUT"
          echo "silo_id=${silo_id}" >> "$GITHUB_OUTPUT"
          echo "address=${address}" >> "$GITHUB_OUTPUT"

      - name: Remove from observed markets and legacy whitelist
        run: |
          set -euo pipefail
          node ./scripts/sync-liquidation-silos.mjs remove \
            --chainKey=${{ inputs.chainKey }} \
            --siloAddress=${{ inputs.siloAddress }}

      - name: Detect changes
        id: detect
        run: |
          snapshot_changed=false
          legacy_whitelist_changed=false

          if ! git diff --quiet -I '^[[:space:]]*"generatedAt":[[:space:]]*".*",$' -- src/data/silos; then
            snapshot_changed=true
          fi
          if ! git diff --quiet -- src/data/positions; then
            legacy_whitelist_changed=true
          fi

          if [ "${snapshot_changed}" = true ] || [ "${legacy_whitelist_changed}" = true ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No snapshot or legacy whitelist changes detected (or only generatedAt changed)."
          fi

      - name: Create PR with silo removal
        if: steps.detect.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: chore/remove-any-silo-${{ inputs.chainKey }}
          commit-message: ${{ steps.market_meta.outputs.commit_message }}
          title: ${{ steps.market_meta.outputs.title }}
          body: |
            Removes a market from the silo snapshot and legacy positions whitelist.

            Positions for this market are dropped on the next `Pull Legacy Positions` run.

            - chain: `${{ inputs.chainKey }}`
            - siloId: `#${{ steps.market_meta.outputs.silo_id }}`
            - silo address: `${{ steps.market_meta.outputs.address }}`
