name: ADD ANY SILO

on:
  workflow_dispatch:
    inputs:
      chainKey:
        description: 'Chain key for the silo'
        required: true
        type: choice
        options:
          - ethereum
          - arbitrum
          - avalanche
          - injective
          - sonic
          - xdc
      siloAddress:
        description: 'Silo market address (0x...)'
        required: true
        type: string
      source_ref:
        description: 'Source ref for scripts (default master). Silo JSON always publishes to legacy-positions; PR targets master-side blacklist/whitelist only.'
        required: false
        default: 'master'
        type: string

permissions:
  contents: write
  pull-requests: write

env:
  TARGET_BRANCH: legacy-positions

jobs:
  add-refresh-silo:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve source ref
        id: refs
        run: |
          set -euo pipefail
          SOURCE_REF="${{ inputs.source_ref }}"
          if [ -z "$SOURCE_REF" ]; then
            SOURCE_REF="master"
          fi
          echo "source_ref=$SOURCE_REF" >> "$GITHUB_OUTPUT"

      - name: Checkout source ref
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.refs.outputs.source_ref }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Record source SHA
        run: echo "SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Add or refresh single silo
        env:
          RPC_URL_ETHEREUM: ${{ secrets.RPC_URL_ETHEREUM }}
          RPC_URL_ARBITRUM: ${{ secrets.RPC_URL_ARBITRUM }}
          RPC_URL_AVALANCHE: ${{ secrets.RPC_URL_AVALANCHE }}
          RPC_URL_SONIC: ${{ secrets.RPC_URL_SONIC }}
          RPC_URL_XDC: ${{ secrets.RPC_URL_XDC }}
          RPC_URL_INJECTIVE: ${{ secrets.RPC_URL_INJECTIVE }}
        run: |
          set -euo pipefail
          node ./scripts/sync-liquidation-silos.mjs add \
            --chainKey=${{ inputs.chainKey }} \
            --siloAddress=${{ inputs.siloAddress }}

      - name: Export sync artifacts
        id: export
        run: |
          set -euo pipefail
          SILOS_DIR="${RUNNER_TEMP}/silos-data-branch"
          MASTER_DIR="${RUNNER_TEMP}/silos-master-side"
          mkdir -p "${SILOS_DIR}" "${MASTER_DIR}/blacklist" "${MASTER_DIR}/positions"
          cp src/data/silos/*.json "${SILOS_DIR}/"
          if [ -d src/data/silos/blacklist ]; then
            cp -R src/data/silos/blacklist/. "${MASTER_DIR}/blacklist/"
          fi
          if [ -d src/data/positions ]; then
            cp -R src/data/positions/. "${MASTER_DIR}/positions/"
          fi

          snapshot_changed=false
          if ! git diff --quiet -I '^[[:space:]]*"generatedAt":[[:space:]]*".*",$' -- src/data/silos/*.json; then
            snapshot_changed=true
          fi
          echo "snapshot_changed=${snapshot_changed}" >> "$GITHUB_OUTPUT"
          echo "SILOS_DIR=${SILOS_DIR}" >> "$GITHUB_ENV"
          echo "MASTER_DIR=${MASTER_DIR}" >> "$GITHUB_ENV"

      - name: Push silo snapshots to data branch
        if: steps.export.outputs.snapshot_changed == 'true'
        env:
          COMMIT_MESSAGE: 'chore: publish silo snapshots after add'
        run: |
          set -euo pipefail
          chmod +x ./scripts/ci/push-silos-to-data-branch.sh
          ./scripts/ci/push-silos-to-data-branch.sh "${SILOS_DIR}"

      - name: Restore source ref for master-side PR
        run: |
          set -euo pipefail
          git checkout -f "${SOURCE_SHA}"
          mkdir -p src/data/silos/blacklist src/data/positions
          cp -R "${MASTER_DIR}/blacklist/." src/data/silos/blacklist/
          cp -R "${MASTER_DIR}/positions/." src/data/positions/

      - name: Detect master-side changes
        id: detect
        run: |
          blacklist_changed=false
          legacy_whitelist_changed=false

          if ! git diff --quiet -- src/data/silos/blacklist; then
            blacklist_changed=true
          fi
          if ! git diff --quiet -- src/data/positions; then
            legacy_whitelist_changed=true
          fi

          if [ "${blacklist_changed}" = true ] || [ "${legacy_whitelist_changed}" = true ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No blacklist or legacy whitelist changes for master PR (silos may still have been published to ${TARGET_BRANCH})."
          fi

      - name: Build PR title and commit message
        id: pr_meta
        if: steps.detect.outputs.has_changes == 'true'
        env:
          CHAIN_KEY: ${{ inputs.chainKey }}
          SILO_ADDRESS: ${{ inputs.siloAddress }}
        run: |
          set -euo pipefail

          chain_upper="$(printf '%s' "$CHAIN_KEY" | tr '[:lower:]' '[:upper:]')"
          address="$(printf '%s' "$SILO_ADDRESS" | tr '[:upper:]' '[:lower:]')"
          market_meta="$(
            node -e '
              const fs = require("fs");
              const chainKey = process.env.CHAIN_KEY;
              const address = (process.env.SILO_ADDRESS || "").toLowerCase();
              const file = `${process.env.SILOS_DIR}/${chainKey}.json`;
              const payload = JSON.parse(fs.readFileSync(file, "utf8"));
              const silos = Array.isArray(payload?.silos) ? payload.silos : [];
              let symbol = "";
              let siloId = "";
              for (const row of silos) {
                if ((row?.siloAddress || "").toLowerCase() === address) {
                  symbol = row?.tokenSymbol || "";
                  siloId = row?.siloId == null ? "" : String(row.siloId);
                  break;
                }
                if ((row?.otherSilo?.siloAddress || "").toLowerCase() === address) {
                  symbol = row?.otherSilo?.tokenSymbol || "";
                  siloId = row?.otherSilo?.siloId == null ? "" : String(row.otherSilo.siloId);
                  break;
                }
              }
              process.stdout.write(`${symbol}\t${siloId}`);
            '
          )"
          IFS=$'\t' read -r token_symbol silo_id <<< "$market_meta"
          silo_ref="#${silo_id:-unknown}"

          if [ -n "$token_symbol" ]; then
            title="Add ${silo_ref} (${token_symbol}) to ${chain_upper}"
          else
            title="Add ${silo_ref} to ${chain_upper}"
          fi
          echo "title=${title}" >> "$GITHUB_OUTPUT"
          echo "commit_message=${title}" >> "$GITHUB_OUTPUT"
          echo "silo_id=${silo_id}" >> "$GITHUB_OUTPUT"
          echo "address=${address}" >> "$GITHUB_OUTPUT"

      - name: Create PR for blacklist / legacy whitelist
        if: steps.detect.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: chore/add-any-silo-${{ inputs.chainKey }}
          commit-message: ${{ steps.pr_meta.outputs.commit_message }}
          title: ${{ steps.pr_meta.outputs.title }}
          add-paths: |
            src/data/silos/blacklist
            src/data/positions
          body: |
            Clears the address from `src/data/silos/blacklist/` when present so the next Refresh V3 Silos run can include it again.

            Updated silo chain JSON (if any) was published directly to `${{ env.TARGET_BRANCH }}` for the Positions UI — this PR does not change `src/data/silos/*.json` on master.

            - chain: `${{ inputs.chainKey }}`
            - siloId: `#${{ steps.pr_meta.outputs.silo_id }}`
            - silo address: `${{ steps.pr_meta.outputs.address }}`
