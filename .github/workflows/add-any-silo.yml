name: ADD ANY SILO

on:
  workflow_dispatch:
    inputs:
      chainKey:
        description: 'Chain key for the silo'
        required: true
        type: choice
        options:
          - ethereum
          - arbitrum
          - avalanche
          - injective
          - sonic
          - xdc
      siloAddress:
        description: 'Silo market address (0x...)'
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  add-refresh-silo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Add or refresh single silo
        env:
          # Private CI-only RPC endpoints. Unset secrets resolve to empty and the script
          # falls back to its hardcoded public RPC default per chain.
          RPC_URL_ETHEREUM: ${{ secrets.RPC_URL_ETHEREUM }}
          RPC_URL_ARBITRUM: ${{ secrets.RPC_URL_ARBITRUM }}
          RPC_URL_AVALANCHE: ${{ secrets.RPC_URL_AVALANCHE }}
          RPC_URL_SONIC: ${{ secrets.RPC_URL_SONIC }}
          RPC_URL_XDC: ${{ secrets.RPC_URL_XDC }}
          RPC_URL_INJECTIVE: ${{ secrets.RPC_URL_INJECTIVE }}
        run: |
          set -euo pipefail
          node ./scripts/sync-liquidation-silos.mjs add \
            --chainKey=${{ inputs.chainKey }} \
            --siloAddress=${{ inputs.siloAddress }}

      - name: Detect changes
        id: detect
        run: |
          snapshot_changed=false
          blacklist_changed=false
          legacy_whitelist_changed=false

          if ! git diff --quiet -I '^[[:space:]]*"generatedAt":[[:space:]]*".*",$' -- src/data/silos/*.json; then
            snapshot_changed=true
          fi
          if ! git diff --quiet -- src/data/silos/blacklist; then
            blacklist_changed=true
          fi
          if ! git diff --quiet -- src/data/positions; then
            legacy_whitelist_changed=true
          fi

          if [ "${snapshot_changed}" = true ] || [ "${blacklist_changed}" = true ] || [ "${legacy_whitelist_changed}" = true ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No snapshot, blacklist, or legacy whitelist changes detected (or only generatedAt changed)."
          fi

      - name: Build PR title and commit message
        id: pr_meta
        if: steps.detect.outputs.has_changes == 'true'
        env:
          CHAIN_KEY: ${{ inputs.chainKey }}
          SILO_ADDRESS: ${{ inputs.siloAddress }}
        run: |
          set -euo pipefail

          chain_upper="$(printf '%s' "$CHAIN_KEY" | tr '[:lower:]' '[:upper:]')"
          address="$(printf '%s' "$SILO_ADDRESS" | tr '[:upper:]' '[:lower:]')"
          market_meta="$(
            node -e '
              const fs = require("fs");
              const chainKey = process.env.CHAIN_KEY;
              const address = (process.env.SILO_ADDRESS || "").toLowerCase();
              const file = `src/data/silos/${chainKey}.json`;
              const payload = JSON.parse(fs.readFileSync(file, "utf8"));
              const silos = Array.isArray(payload?.silos) ? payload.silos : [];
              let symbol = "";
              let siloId = "";
              for (const row of silos) {
                if ((row?.siloAddress || "").toLowerCase() === address) {
                  symbol = row?.tokenSymbol || "";
                  siloId = row?.siloId == null ? "" : String(row.siloId);
                  break;
                }
                if ((row?.otherSilo?.siloAddress || "").toLowerCase() === address) {
                  symbol = row?.otherSilo?.tokenSymbol || "";
                  siloId = row?.otherSilo?.siloId == null ? "" : String(row.otherSilo.siloId);
                  break;
                }
              }
              process.stdout.write(`${symbol}\t${siloId}`);
            '
          )"
          IFS=$'\t' read -r token_symbol silo_id <<< "$market_meta"
          silo_ref="#${silo_id:-unknown}"

          if [ -n "$token_symbol" ]; then
            title="Add ${silo_ref} (${token_symbol}) to ${chain_upper}"
          else
            title="Add ${silo_ref} to ${chain_upper}"
          fi
          echo "title=${title}" >> "$GITHUB_OUTPUT"
          echo "commit_message=${title}" >> "$GITHUB_OUTPUT"
          echo "silo_id=${silo_id}" >> "$GITHUB_OUTPUT"
          echo "address=${address}" >> "$GITHUB_OUTPUT"

      - name: Create PR with silo refresh
        if: steps.detect.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: chore/add-any-silo-${{ inputs.chainKey }}
          commit-message: ${{ steps.pr_meta.outputs.commit_message }}
          title: ${{ steps.pr_meta.outputs.title }}
          body: |
            Automated add/refresh for a single silo snapshot entry (target only).

            Clears the address from `src/data/silos/blacklist/` when present so the next full refresh can include it again.

            - chain: `${{ inputs.chainKey }}`
            - siloId: `#${{ steps.pr_meta.outputs.silo_id }}`
            - silo address: `${{ steps.pr_meta.outputs.address }}`
