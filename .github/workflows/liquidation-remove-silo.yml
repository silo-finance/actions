name: Liquidation Snapshot Remove Silo

on:
  workflow_dispatch:
    inputs:
      chainKey:
        description: 'Chain key where this silo should be removed'
        required: true
        type: choice
        options:
          - ethereum
          - arbitrum
          - avalanche
          - injective
          - sonic
          - xdc
      siloAddress:
        description: 'Silo market address (0x...)'
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

env:
  LEGACY_POSITIONS_BRANCH: legacy-positions

jobs:
  remove-silo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Check legacy primary market removal
        id: legacy_check
        run: |
          set -euo pipefail
          python3 scripts/pull_borrowers/legacy_market_removal.py check \
            --chain "${{ inputs.chainKey }}" \
            --silo-address "${{ inputs.siloAddress }}"

      - name: Resolve market metadata for messages
        id: market_meta
        env:
          CHAIN_KEY: ${{ inputs.chainKey }}
          SILO_ADDRESS: ${{ inputs.siloAddress }}
        run: |
          set -euo pipefail

          chain_upper="$(printf '%s' "$CHAIN_KEY" | tr '[:lower:]' '[:upper:]')"
          address="$(printf '%s' "$SILO_ADDRESS" | tr '[:upper:]' '[:lower:]')"
          token_symbol="$(
            node -e '
              const fs = require("fs");
              const chainKey = process.env.CHAIN_KEY;
              const address = (process.env.SILO_ADDRESS || "").toLowerCase();
              const file = `src/data/liquidation/silos/${chainKey}.json`;
              const payload = JSON.parse(fs.readFileSync(file, "utf8"));
              const silos = Array.isArray(payload?.silos) ? payload.silos : [];
              let symbol = "";
              for (const row of silos) {
                if ((row?.siloAddress || "").toLowerCase() === address) {
                  symbol = row?.tokenSymbol || "";
                  break;
                }
                if ((row?.otherSilo?.siloAddress || "").toLowerCase() === address) {
                  symbol = row?.otherSilo?.tokenSymbol || "";
                  break;
                }
              }
              process.stdout.write(symbol);
            '
          )"

          if [ -n "$token_symbol" ]; then
            title="Remove market (${address}) ${token_symbol} from ${chain_upper}"
          else
            title="Remove market (${address}) from ${chain_upper}"
          fi

          echo "title=${title}" >> "$GITHUB_OUTPUT"
          echo "commit_message=${title}" >> "$GITHUB_OUTPUT"

      - name: Remove single silo
        run: |
          set -euo pipefail
          node ./scripts/sync-liquidation-silos.mjs remove \
            --chainKey=${{ inputs.chainKey }} \
            --siloAddress=${{ inputs.siloAddress }}

      - name: Detect snapshot changes
        id: detect
        run: |
          if git diff --quiet -I '^[[:space:]]*"generatedAt":[[:space:]]*".*",$' -- src/data/liquidation/silos; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No snapshot changes detected (or only generatedAt changed)."
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create PR with silo removal
        if: steps.detect.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: chore/liquidation-remove-silo-${{ inputs.chainKey }}
          commit-message: ${{ steps.market_meta.outputs.commit_message }}
          title: ${{ steps.market_meta.outputs.title }}
          body: |
            Automated removal of a liquidation silo snapshot entry.

            - chain: `${{ inputs.chainKey }}`
            - silo: `${{ inputs.siloAddress }}`

      - name: Prune legacy positions on data branch
        if: steps.legacy_check.outputs.should_prune_legacy == 'true'
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin "${LEGACY_POSITIONS_BRANCH}" || true
          if git show-ref --verify --quiet "refs/remotes/origin/${LEGACY_POSITIONS_BRANCH}"; then
            git checkout -B "${LEGACY_POSITIONS_BRANCH}" "origin/${LEGACY_POSITIONS_BRANCH}"
          else
            echo "::notice::${LEGACY_POSITIONS_BRANCH} branch does not exist yet; skipping legacy JSON prune."
            exit 0
          fi

          # legacy-positions is data-only; borrow the helper from the workflow commit, then drop it.
          git checkout "${GITHUB_SHA}" -- scripts/pull_borrowers/legacy_market_removal.py

          python3 scripts/pull_borrowers/legacy_market_removal.py prune \
            --chain "${{ inputs.chainKey }}" \
            --silo-address "${{ inputs.siloAddress }}"

          git restore --staged scripts/pull_borrowers/legacy_market_removal.py
          rm -f scripts/pull_borrowers/legacy_market_removal.py

          git add \
            "scripts/pull_borrowers/${{ inputs.chainKey }}_borrowers.json" \
            "scripts/pull_borrowers/${{ inputs.chainKey }}_positions.json" || true

          if git diff --staged --quiet; then
            echo "::notice::No legacy JSON changes to commit for ${{ inputs.chainKey }}:${{ inputs.siloAddress }}."
            exit 0
          fi

          git commit -m "${{ steps.market_meta.outputs.commit_message }}"
          git push origin "HEAD:${LEGACY_POSITIONS_BRANCH}"
