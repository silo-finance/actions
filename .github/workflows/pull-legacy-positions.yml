name: Pull Legacy Positions

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Source ref to run legacy positions scripts from (branch, tag, or SHA)"
        required: false
        default: "master"
        type: string
      chain:
        description: "Chain to pull legacy positions for. Use 'all' (default) to run every chain."
        required: false
        default: "all"
        type: choice
        options:
          - all
          - sonic
          - ethereum
          - avalanche
          - arbitrum
  schedule:
    # Every hour at minute 0 (UTC); runs every chain.
    - cron: "0 * * * *"

permissions:
  contents: write

concurrency:
  group: pull-legacy-positions-${{ github.workflow }}-${{ inputs.source_ref || github.ref_name || 'master' }}
  cancel-in-progress: false

env:
  TARGET_BRANCH: legacy-positions

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      chains: ${{ steps.matrix.outputs.chains }}
      source_ref: ${{ steps.matrix.outputs.source_ref }}
    steps:
      - name: Compute chain matrix
        id: matrix
        run: |
          set -euo pipefail
          CHAIN_INPUT="${{ inputs.chain }}"
          SOURCE_REF="${{ inputs.source_ref }}"
          if [ -z "$SOURCE_REF" ]; then
            # Scheduled runs have no inputs; default the source ref to master.
            SOURCE_REF="master"
          fi
          if [ -z "$CHAIN_INPUT" ] || [ "$CHAIN_INPUT" = "all" ]; then
            # Schedule runs and explicit "all" fan out to every supported chain.
            CHAINS='["sonic","ethereum","avalanche","arbitrum"]'
          else
            # Manual dispatch with a specific chain runs only that chain.
            CHAINS="[\"$CHAIN_INPUT\"]"
          fi
          echo "chains=$CHAINS" >> "$GITHUB_OUTPUT"
          echo "source_ref=$SOURCE_REF" >> "$GITHUB_OUTPUT"
          echo "::notice::Resolved chains: $CHAINS (source ref: $SOURCE_REF)"

  pull-legacy-positions:
    needs: setup
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Serialize so matrix jobs do not race pushing to the shared target branch.
      max-parallel: 1
      matrix:
        chain: ${{ fromJSON(needs.setup.outputs.chains) }}
    env:
      CHAIN: ${{ matrix.chain }}
      SOURCE_REF: ${{ needs.setup.outputs.source_ref }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_REF }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate The Graph API key secret
        run: |
          if [ -z "${THE_GRAPH_API_KEY:-}" ]; then
            echo "::error::Missing THE_GRAPH_API_KEY secret."
            exit 1
          fi
        env:
          THE_GRAPH_API_KEY: ${{ secrets.THE_GRAPH_API_KEY }}

      - name: Fetch legacy borrowers
        run: |
          set -euo pipefail
          python3 scripts/pull_borrowers/fetch_legacy_borrowers.py \
            --chain "$CHAIN"
        env:
          THE_GRAPH_API_KEY: ${{ secrets.THE_GRAPH_API_KEY }}

      - name: Build legacy positions
        run: |
          set -euo pipefail
          python3 scripts/pull_borrowers/build_legacy_positions_from_borrowers.py \
            --chain "$CHAIN"

      - name: Prepare output bundle
        run: |
          set -euo pipefail
          EXPORT_DIR="${RUNNER_TEMP}/legacy-positions-sync"
          mkdir -p "${EXPORT_DIR}"
          cp "scripts/pull_borrowers/${CHAIN}_borrowers.json" "${EXPORT_DIR}/${CHAIN}_borrowers.json"
          cp "scripts/pull_borrowers/${CHAIN}_positions.json" "${EXPORT_DIR}/${CHAIN}_positions.json"
          echo "EXPORT_DIR=${EXPORT_DIR}" >> "$GITHUB_ENV"

      - name: Upload sync artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.CHAIN }}-positions-sync
          path: ${{ env.EXPORT_DIR }}/
          if-no-files-found: error

      - name: Commit positions to target branch
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ -z "${EXPORT_DIR:-}" ] || [ ! -f "${EXPORT_DIR}/${CHAIN}_borrowers.json" ] || [ ! -f "${EXPORT_DIR}/${CHAIN}_positions.json" ]; then
            echo "::error::Sync bundle missing in ${EXPORT_DIR:-<unset>}"
            exit 1
          fi

          # Clean workspace before branch switch; bundle lives outside the repo in RUNNER_TEMP.
          git reset --hard HEAD
          git clean -fd

          # Retry to absorb races with concurrent pushes to the shared target branch.
          for attempt in 1 2 3; do
            git fetch origin "${TARGET_BRANCH}" || true
            if git show-ref --verify --quiet "refs/remotes/origin/${TARGET_BRANCH}"; then
              git checkout -B "${TARGET_BRANCH}" "origin/${TARGET_BRANCH}"
            else
              git checkout -B "${TARGET_BRANCH}"
            fi

            mkdir -p scripts/pull_borrowers
            cp "${EXPORT_DIR}/${CHAIN}_borrowers.json" "scripts/pull_borrowers/${CHAIN}_borrowers.json"
            cp "${EXPORT_DIR}/${CHAIN}_positions.json" "scripts/pull_borrowers/${CHAIN}_positions.json"

            git add \
              "scripts/pull_borrowers/${CHAIN}_borrowers.json" \
              "scripts/pull_borrowers/${CHAIN}_positions.json"

            if git diff --staged --quiet; then
              echo "::notice::No data changes to commit for ${CHAIN}."
              exit 0
            fi

            git commit -m "chore: sync ${CHAIN} legacy positions"
            if git push origin "HEAD:${TARGET_BRANCH}"; then
              echo "::notice::Pushed ${CHAIN} legacy positions on attempt ${attempt}."
              exit 0
            fi

            echo "::warning::Push for ${CHAIN} failed on attempt ${attempt}; retrying after rebase."
            git reset --hard HEAD~1 || true
          done

          echo "::error::Failed to push ${CHAIN} legacy positions after 3 attempts."
          exit 1

      - name: Log published URLs
        run: |
          echo "::notice::Source ref: ${SOURCE_REF}"
          echo "::notice::Target branch: ${TARGET_BRANCH}"
          echo "::notice::Updated files:"
          echo "::notice:: - scripts/pull_borrowers/${CHAIN}_borrowers.json"
          echo "::notice:: - scripts/pull_borrowers/${CHAIN}_positions.json"
          echo "::notice::Borrowers URL: https://raw.githubusercontent.com/${{ github.repository }}/refs/heads/${TARGET_BRANCH}/scripts/pull_borrowers/${CHAIN}_borrowers.json"
          echo "::notice::Positions URL: https://raw.githubusercontent.com/${{ github.repository }}/refs/heads/${TARGET_BRANCH}/scripts/pull_borrowers/${CHAIN}_positions.json"
