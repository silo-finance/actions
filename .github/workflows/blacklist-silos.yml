name: BLACKLIST SILOS

on:
  workflow_dispatch:
    inputs:
      config:
        description: 'Paste clipboard JSON from Positions UI: { "markets": [ { "chainKey", "siloAddress" } ] }'
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  blacklist-silos:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Apply blacklist batch
        env:
          BLACKLIST_CONFIG: ${{ inputs.config }}
          RPC_URL_ETHEREUM: ${{ secrets.RPC_URL_ETHEREUM }}
          RPC_URL_ARBITRUM: ${{ secrets.RPC_URL_ARBITRUM }}
          RPC_URL_AVALANCHE: ${{ secrets.RPC_URL_AVALANCHE }}
          RPC_URL_SONIC: ${{ secrets.RPC_URL_SONIC }}
          RPC_URL_XDC: ${{ secrets.RPC_URL_XDC }}
          RPC_URL_INJECTIVE: ${{ secrets.RPC_URL_INJECTIVE }}
        run: |
          set -euo pipefail
          printf '%s' "$BLACKLIST_CONFIG" > /tmp/blacklist-config.json
          node ./scripts/sync-liquidation-silos.mjs blacklist --configFile=/tmp/blacklist-config.json

      - name: Detect changes
        id: detect
        run: |
          snapshot_changed=false
          blacklist_changed=false
          legacy_whitelist_changed=false

          if ! git diff --quiet -I '^[[:space:]]*"generatedAt":[[:space:]]*".*",$' -- src/data/silos/*.json; then
            snapshot_changed=true
          fi
          if ! git diff --quiet -- src/data/silos/blacklist; then
            blacklist_changed=true
          fi
          if ! git diff --quiet -- src/data/positions; then
            legacy_whitelist_changed=true
          fi

          if [ "${snapshot_changed}" = true ] || [ "${blacklist_changed}" = true ] || [ "${legacy_whitelist_changed}" = true ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No snapshot, blacklist, or legacy whitelist changes detected."
          fi

      - name: Create PR with blacklisted markets
        if: steps.detect.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: chore/blacklist-silos
          commit-message: 'chore: blacklist silo markets'
          title: 'chore: blacklist silo markets'
          body: |
            Batch-removes markets from the silo snapshot and appends v3 addresses to the durable blacklist so full refresh will not re-add them.

            Paste source: Positions UI clipboard JSON.
