name: BLACKLIST SILOS

on:
  workflow_dispatch:
    inputs:
      config:
        description: 'Paste clipboard JSON from Positions UI: { "markets": [ { "chainKey", "siloAddress" } ] }'
        required: true
        type: string
      source_ref:
        description: 'Source ref for scripts (default develop). Silo JSON always publishes to legacy-positions; PR targets develop for blacklist/whitelist.'
        required: false
        default: 'develop'
        type: string

permissions:
  contents: write
  pull-requests: write

env:
  TARGET_BRANCH: legacy-positions
  PR_BASE_BRANCH: develop

jobs:
  blacklist-silos:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve source ref
        id: refs
        run: |
          set -euo pipefail
          SOURCE_REF="${{ inputs.source_ref }}"
          if [ -z "$SOURCE_REF" ]; then
            SOURCE_REF="develop"
          fi
          echo "source_ref=$SOURCE_REF" >> "$GITHUB_OUTPUT"

      - name: Checkout source ref
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.refs.outputs.source_ref }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          # No packageManager in package.json; keep install step explicit.
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Bootstrap silo baseline from legacy-positions
        run: |
          set -euo pipefail
          chmod +x ./scripts/ci/bootstrap-silos-from-data-branch.sh
          ./scripts/ci/bootstrap-silos-from-data-branch.sh

      - name: Apply blacklist batch
        env:
          BLACKLIST_CONFIG: ${{ inputs.config }}
          RPC_URL_ETHEREUM: ${{ secrets.RPC_URL_ETHEREUM }}
          RPC_URL_ARBITRUM: ${{ secrets.RPC_URL_ARBITRUM }}
          RPC_URL_AVALANCHE: ${{ secrets.RPC_URL_AVALANCHE }}
          RPC_URL_SONIC: ${{ secrets.RPC_URL_SONIC }}
          RPC_URL_XDC: ${{ secrets.RPC_URL_XDC }}
          RPC_URL_INJECTIVE: ${{ secrets.RPC_URL_INJECTIVE }}
        run: |
          set -euo pipefail
          printf '%s' "$BLACKLIST_CONFIG" > /tmp/blacklist-config.json
          node ./scripts/sync-liquidation-silos.mjs blacklist --configFile=/tmp/blacklist-config.json

      - name: Export sync artifacts
        id: export
        run: |
          set -euo pipefail
          SILOS_DIR="${RUNNER_TEMP}/silos-data-branch"
          APP_SIDE_DIR="${RUNNER_TEMP}/silos-app-side"
          mkdir -p "${SILOS_DIR}" "${APP_SIDE_DIR}/blacklist" "${APP_SIDE_DIR}/positions"
          cp src/data/silos/*.json "${SILOS_DIR}/"
          if [ -d src/data/silos/blacklist ]; then
            cp -R src/data/silos/blacklist/. "${APP_SIDE_DIR}/blacklist/"
          fi
          if [ -d src/data/positions ]; then
            cp -R src/data/positions/. "${APP_SIDE_DIR}/positions/"
          fi

          snapshot_changed=false
          if ! git diff --quiet -I '^[[:space:]]*"generatedAt":[[:space:]]*".*",$' -- src/data/silos/*.json; then
            snapshot_changed=true
          fi
          echo "snapshot_changed=${snapshot_changed}" >> "$GITHUB_OUTPUT"
          echo "SILOS_DIR=${SILOS_DIR}" >> "$GITHUB_ENV"
          echo "APP_SIDE_DIR=${APP_SIDE_DIR}" >> "$GITHUB_ENV"

      - name: Push silo snapshots to data branch
        if: steps.export.outputs.snapshot_changed == 'true'
        env:
          COMMIT_MESSAGE: 'chore: publish silo snapshots after blacklist'
        run: |
          set -euo pipefail
          chmod +x ./scripts/ci/push-silos-to-data-branch.sh
          ./scripts/ci/push-silos-to-data-branch.sh "${SILOS_DIR}"

      - name: Checkout develop for blacklist / whitelist PR
        run: |
          set -euo pipefail
          # Push to the data branch leaves a detached HEAD; create-pull-request needs a branch + base.
          git fetch origin "${PR_BASE_BRANCH}"
          git checkout -B "${PR_BASE_BRANCH}" "origin/${PR_BASE_BRANCH}"
          mkdir -p src/data/silos/blacklist src/data/positions
          cp -R "${APP_SIDE_DIR}/blacklist/." src/data/silos/blacklist/
          cp -R "${APP_SIDE_DIR}/positions/." src/data/positions/

      - name: Detect develop-side changes
        id: detect
        run: |
          blacklist_changed=false
          legacy_whitelist_changed=false

          if ! git diff --quiet -- src/data/silos/blacklist; then
            blacklist_changed=true
          fi
          if ! git diff --quiet -- src/data/positions; then
            legacy_whitelist_changed=true
          fi

          if [ "${blacklist_changed}" = true ] || [ "${legacy_whitelist_changed}" = true ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No blacklist or legacy whitelist changes for ${PR_BASE_BRANCH} PR (silos may still have been published to ${TARGET_BRANCH})."
          fi

      - name: Create PR for blacklist / legacy whitelist
        if: steps.detect.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          base: develop
          branch: chore/blacklist-silos
          commit-message: 'chore: blacklist silo markets'
          title: 'chore: blacklist silo markets'
          add-paths: |
            src/data/silos/blacklist
            src/data/positions
          body: |
            Batch-removes markets from the live silo list on `${{ env.TARGET_BRANCH }}` (published directly) and appends v3 addresses to the durable blacklist on `develop` so Refresh V3 Silos will not re-add them after merge.

            Paste source: Positions UI clipboard JSON.
